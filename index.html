<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Code Editor</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cascadia+Code:ital,wght@0,200..700;1,200..700&display=swap"
      rel="stylesheet" />
  </head>
  <body>
    <header>
      <div class="container row">
        <div>
          <div class="logo"></div>
          <div class="title">Code Editor</div>
        </div>

        <div class="row">
          <button
            class="btn secondary"
            id="saveButton"
            title="Save 
          Work Locally">
            <span class="">Save</span>
          </button>
          <button class="btn secondary" id="loadButton" title="Load File">
            <span class="">Load</span>
            <input id="openFile" type="file" accept="application/json" hidden />
          </button>
        </div>
      </div>
    </header>

    <main>
      <aside class="card stack panel">
        <h2>Task / Assignment</h2>
        <textarea
          id="assignment"
          class="text"
          placeholder="Write task description here"></textarea>
        <div class="stack">
          <label for="testArea"
            >Validation tests (JavaScript only - optional)
          </label>
          <textarea
            id="testArea"
            class="text"
            placeholder="Write simple tests"></textarea>
        </div>

        <div class="muted">
          Tip: <span class="kbd">Ctrl</span> + <span class="kbd">S</span> to
          save, <span class="kbd">Ctrl</span> +
          <span class="kbd">Enter</span> to run
        </div>
      </aside>

      <section class="stack" id="web-only">
        <div id="web-editors" class="stack panel card">
          <div class="row">
            <h2>HTML / CSS / JavaScript</h2>
            <div class="row">
              <button class="btn ok" id="runWeb">Run</button>
              <button class="btn secondary" id="openPreview">
                Open Preview In New Window
              </button>
            </div>
          </div>

          <div
            class="tabs"
            id="webTabs"
            role="tablist"
            aria-label="web editors">
            <button
              class="tab active"
              role="tab"
              aria-selected="true"
              tabindex="0"
              data-pane="html">
              HTML
            </button>
            <button
              class="tab"
              role="tab"
              aria-selected="false"
              tabindex="-1"
              data-pane="css">
              CSS
            </button>
            <button
              class="tab"
              role="tab"
              aria-selected="false"
              tabindex="-1"
              data-pane="js">
              JavaScript
            </button>
          </div>

          <div class="editor-wrap" data-pane="html">
            <div id="editor_html" class="editor"></div>
          </div>

          <div class="editor-wrap" data-pane="css" hidden>
            <div id="editor_css" class="editor"></div>
          </div>

          <div class="editor-wrap" data-pane="js" hidden>
            <div id="editor_js" class="editor"></div>
          </div>
        </div>

        <div class="stack">
          <h3>Preview</h3>
          <iframe
            id="preview"
            class="preview"
            sandbox="allow-scripts allow-same-origin allow-modals"></iframe>
        </div>
      </section>

      <aside class="card panel stack">
        <h2>Output</h2>
        <div class="out" id="output" aria-live="polite"></div>
        <div class="row">
          <button class="btn warn" id="runTests">Run with tests</button>
          <button class="btn secondary" id="clearOutput">Clear Log</button>
        </div>
        <h3>Notes</h3>
        <ul class="muted">
          <li>Everything runs inside the browser in a sandbox</li>
          <li>You can save the work as a JSON file and restore it</li>
        </ul>
      </aside>
    </main>
    <footer class="footer">Built with HTML, CSS and JavaScript</footer>

    <script src="script.js"></script>
  </body>
</html>
